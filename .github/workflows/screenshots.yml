name: PR screenshots

# Reusable workflow: builds the calling repo's site, starts it, screenshots a PR's
# pages at desktop and mobile widths, stores the images on the orphan
# `pr-screenshots` branch so they embed inline, and keeps one sticky comment on the
# PR up to date. Pages come from the PR description's `## Screenshots` section plus
# routes the caller's rules file maps from changed files; `/` is always included.
#
#   jobs:
#     screenshots:
#       if: github.event.pull_request.head.repo.full_name == github.repository
#       uses: zmnatz/github-workflows/.github/workflows/screenshots.yml@v1
#       permissions: { contents: write, pull-requests: write }
#       with:
#         rules: test/playwright/config/screenshots.yml
on:
  workflow_call:
    inputs:
      rules:
        description: Path to the YAML file mapping changed files to routes.
        type: string
        required: true
      noise:
        description: Path to the YAML file of known console and network noise.
        type: string
        default: ''
      build:
        description: Command that builds the site.
        type: string
        default: bun run build
      install:
        description: Command that installs the site's dependencies.
        type: string
        default: bun install --frozen-lockfile
      start:
        description: Command that serves the build; {port} is a free port, also in $PORT.
        type: string
        default: node_modules/.bin/next start -H 127.0.0.1 -p {port}
      vars:
        description: Shell command printing name=value lines that fill {name} in routes.
        type: string
        default: ''
      bun-version:
        type: string
        default: latest
      node-version-file:
        description: A file naming the Node version the site builds with, such as .nvmrc. Without one the job uses Node 24.
        type: string
        default: ''
      tool-ref:
        description: The ref of this repo to run the tool from.
        type: string
        default: v1

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # A container job's steps default to sh, and these use bash.
    defaults:
      run:
        shell: bash
    container:
      # Floating tag: the newest Playwright image, with Chromium and its system libraries.
      image: mcr.microsoft.com/playwright:noble
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The image lacks the GitHub CLI and git, and setup-bun needs unzip.
      - name: Install the GitHub CLI, git and unzip
        run: apt-get update -qq && apt-get install -y -qq gh git unzip

      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zmnatz/github-workflows
          ref: ${{ inputs.tool-ref }}
          path: .github-workflows
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      # The image's Node is too old to run the TypeScript tooling directly.
      - uses: actions/setup-node@v4
        if: inputs.node-version-file == ''
        with:
          node-version: 24
      - uses: actions/setup-node@v4
        if: inputs.node-version-file != ''
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - run: ${{ inputs.install }}

      - name: Read the PR description and changed files
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body -q .body > pr-body.md
          # Not `gh pr diff`, which fails above 300 files.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > changed-files.txt

      - name: Build the site
        run: ${{ inputs.build }}

      # Only the tool's own dependencies, not the site's.
      - name: Install the screenshot tooling
        working-directory: .github-workflows/screenshots
        run: npm install --no-audit --no-fund --no-package-lock

      # A no-op when the image's browser build matches the Playwright version just
      # installed; otherwise it fetches the matching Chromium.
      - name: Ensure the matching Chromium
        working-directory: .github-workflows/screenshots
        run: npx playwright-core install chromium

      - name: Take screenshots
        env:
          RULES: ${{ inputs.rules }}
          NOISE: ${{ inputs.noise }}
          START: ${{ inputs.start }}
          VARS: ${{ inputs.vars }}
        run: |
          args=(--rules "$RULES" --start "$START" --changed-files changed-files.txt --pr-body pr-body.md --out screenshots)
          [ -n "$NOISE" ] && args+=(--noise "$NOISE")
          if [ -n "$VARS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && args+=(--var "$line")
            done < <(sh -c "$VARS")
          fi
          node .github-workflows/screenshots/capture.ts "${args[@]}"

      - name: Publish images to the pr-screenshots branch
        if: always() && hashFiles('screenshots/report.json') != ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin pr-screenshots >/dev/null; then
            git fetch origin pr-screenshots
            git worktree add shots-branch origin/pr-screenshots --detach
          else
            git worktree add --orphan -b pr-screenshots shots-branch
          fi
          dir="shots-branch/pr-$PR/$SHA"
          mkdir -p "$dir"
          cp screenshots/*.png "$dir/"
          cd shots-branch
          git add -A
          git commit -m "Screenshots for PR $PR at $SHA" || true
          # Other PRs push to this branch too.
          for _ in 1 2 3; do
            git push origin HEAD:pr-screenshots && exit 0
            git fetch origin pr-screenshots
            git rebase origin/pr-screenshots
          done
          exit 1

      - name: Build the comment
        if: always() && hashFiles('screenshots/report.json') != ''
        run: |
          node .github-workflows/screenshots/comment.ts \
            --report screenshots/report.json \
            --image-base-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/pr-screenshots/pr-$PR/$SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --sha "$SHA" \
            --out comment.md

      - name: Create or update the PR comment
        if: always() && hashFiles('comment.md') != ''
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- pr-screenshots -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
