name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color
      - name: shellcheck the scripts
        run: shellcheck scripts/*.sh
  screenshots:
    # The screenshot tool's unit tests (screenshots/__tests__).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screenshots
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm test
  google-analytics:
    # The script's tests, and the action itself on a one-page site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'google-analytics/__tests__/*.test.mjs'
      - run: mkdir site && echo '<html><head></head><body></body></html>' > site/index.html
      - uses: ./google-analytics
        with:
          site-dir: site
          tag-id: G-TEST123
      - run: grep -q 'gtag/js?id=G-TEST123' site/index.html
